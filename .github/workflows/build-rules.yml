name: Build consolidated rules

on:
  workflow_dispatch:
  schedule:
    # 04:17 Asia/Shanghai / Asia/Tokyo every day.
    - cron: "17 20 * * *"
  push:
    branches: [main]
    paths:
      - "tools/sort_add_rules.py"
      - "tools/rule_files.py"
      - "tools/rule_sort.py"
      - "tools/check_rule_order.py"
      - "tools/build_rules.py"
      - "tools/build_dist_manifest.py"
      - "tools/test_dns_rules.py"
      - "tools/fetch_geox.py"
      - "RULE_PRIORITIES.json"
      - "DIST_MANIFEST.json"
      - "*.list"
      - "dns/**"
      - "oxidns/**"
      - "geox/**"
      - ".github/workflows/build-rules.yml"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: build-consolidated-rules
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Sort manual add rules
        run: python3 tools/sort_add_rules.py

      - name: Test DNS rule generation
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Build consolidated rule files
        run: python3 tools/build_rules.py

      - name: Verify deterministic rule ordering
        run: python3 tools/check_rule_order.py

      - name: Download GeoX assets
        run: python3 tools/fetch_geox.py

      - name: Build distribution manifest
        run: python3 tools/build_dist_manifest.py

      - name: Show generated changes
        run: |
          set -euo pipefail
          mapfile -t published_files < <(
            python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("DIST_MANIFEST.json").read_text(encoding="utf-8"))
          for path in manifest["files"]:
              print(path)
          PY
          )
          git status --short -- "${published_files[@]}" DIST_MANIFEST.json
          git diff -- "${published_files[@]}" DIST_MANIFEST.json

      - name: Commit sorted and generated files
        run: |
          set -euo pipefail
          mapfile -t published_files < <(
            python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("DIST_MANIFEST.json").read_text(encoding="utf-8"))
          for path in manifest["files"]:
              print(path)
          PY
          )
          generated_files=("${published_files[@]}" "DIST_MANIFEST.json")

          if [ -z "$(git status --porcelain -- "${generated_files[@]}")" ]; then
            echo "No manual-rule, generated-rule, GeoX, or distribution-manifest changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${generated_files[@]}"
          git commit -m "Sort manual rules and build consolidated assets"
          git push

      # JSDMirror uses jsDelivr upstream; its edge cache is refreshed separately below.
      - name: Purge jsDelivr upstream cache
        run: |
          set -euo pipefail
          sleep 5

          mapfile -t published_files < <(
            python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("DIST_MANIFEST.json").read_text(encoding="utf-8"))
          for path in manifest["files"]:
              print(path)
          PY
          )

          failures=0
          for file in "${published_files[@]}"; do
            url="https://purge.jsdelivr.net/gh/felixbennettio/proxy_rules@main/${file}"
            echo "Purging ${url}"
            curl --fail --location --silent --show-error --connect-timeout 10 --max-time 30 --retry-max-time 120 --retry 5 --retry-delay 2 --retry-all-errors "${url}" || failures=$((failures + 1))
          done

          if [ "${failures}" -gt 0 ]; then
            echo "::warning::${failures} jsDelivr upstream purge requests failed."
          fi

      - name: Refresh JSDMirror edge cache
        env:
          JSDMIRROR_API_KEY: ${{ secrets.JSDMIRROR_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${JSDMIRROR_API_KEY}" ]; then
            echo "::warning::JSDMIRROR_API_KEY is not configured; JSDMirror updates rely on cache expiry. Use GitHub Raw for urgent updates."
            exit 0
          fi

          temp_dir="$(mktemp -d)"
          trap 'rm -rf -- "$temp_dir"' EXIT
          mapfile -t published_files < <(
            python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("DIST_MANIFEST.json").read_text(encoding="utf-8"))
          for path in manifest["files"]:
              print(path)
          PY
          )

          failures=0
          for file in "${published_files[@]}"; do
            url="https://cdn.jsdmirror.com/gh/felixbennettio/proxy_rules@main/${file}"
            echo "Refreshing ${url}"
            python3 - "$url" > "$temp_dir/payload.json" <<'PY'
          import json
          import sys
          print(json.dumps({"url": sys.argv[1], "method": "invalidate"}))
          PY
            if curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
              --retry 3 --retry-delay 2 --retry-max-time 120 --retry-all-errors \
              --header "Content-Type: application/json" \
              --header "X-API-Key: ${JSDMIRROR_API_KEY}" \
              --data-binary "@$temp_dir/payload.json" \
              --output "$temp_dir/response.json" \
              "https://cache.jsdmirror.com/api/v1/purge"; then
              if python3 - "$temp_dir/response.json" <<'PY'
          import json
          import sys
          try:
              with open(sys.argv[1], encoding="utf-8") as response:
                  accepted = json.load(response).get("success") is True
          except (OSError, ValueError, AttributeError):
              accepted = False
          sys.exit(0 if accepted else 1)
          PY
              then
                continue
              fi
            fi
            echo "::warning::JSDMirror refresh was not accepted for ${file}."
            failures=$((failures + 1))
          done

          if [ "${failures}" -gt 0 ]; then
            echo "::warning::${failures} JSDMirror refresh requests failed; use GitHub Raw until caches expire."
          fi
