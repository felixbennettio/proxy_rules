name: Build consolidated rules

on:
  workflow_dispatch:
  schedule:
    # 04:17 Asia/Shanghai / Asia/Tokyo every day.
    - cron: "17 20 * * *"
  push:
    branches: [main]
    paths:
      - "tools/sort_added_rules.py"
      - "tools/build_rules.py"
      - "tools/build_dist_manifest.py"
      - "tools/fetch_geox.py"
      - "DIST_MANIFEST.json"
      - "*.list"
      - "oxidns/**"
      - "geox/**"
      - ".github/workflows/build-rules.yml"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: build-consolidated-rules
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Sort manual added rules
        run: python3 tools/sort_added_rules.py

      - name: Build consolidated rule files
        run: python3 tools/build_rules.py

      - name: Download GeoX assets
        run: python3 tools/fetch_geox.py

      - name: Build distribution manifest
        run: python3 tools/build_dist_manifest.py

      - name: Show generated changes
        run: |
          set -euo pipefail
          added_files=("proxy_added.list" "direct_added.list" "reject_added.list")
          mapfile -t published_files < <(
            python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("DIST_MANIFEST.json").read_text(encoding="utf-8"))
          for path in manifest["files"]:
              print(path)
          PY
          )
          git status --short -- "${added_files[@]}" "${published_files[@]}" DIST_MANIFEST.json
          git diff -- "${added_files[@]}" "${published_files[@]}" DIST_MANIFEST.json

      - name: Commit sorted and generated files
        run: |
          set -euo pipefail
          added_files=("proxy_added.list" "direct_added.list" "reject_added.list")
          mapfile -t published_files < <(
            python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("DIST_MANIFEST.json").read_text(encoding="utf-8"))
          for path in manifest["files"]:
              print(path)
          PY
          )
          generated_files=("${added_files[@]}" "${published_files[@]}" "DIST_MANIFEST.json")

          if [ -z "$(git status --porcelain -- "${generated_files[@]}")" ]; then
            echo "No manual-rule, generated-rule, GeoX, or distribution-manifest changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${generated_files[@]}"
          git commit -m "Sort manual rules and build consolidated assets"
          git push

      - name: Purge jsDelivr cache
        run: |
          set -euo pipefail
          sleep 5

          mapfile -t published_files < <(
            python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("DIST_MANIFEST.json").read_text(encoding="utf-8"))
          for path in manifest["files"]:
              print(path)
          PY
          )

          failures=0
          for file in "${published_files[@]}"; do
            url="https://purge.jsdelivr.net/gh/felixbennettio/proxy_rules@main/${file}"
            echo "Purging ${url}"
            curl --fail --location --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "${url}" || failures=$((failures + 1))
          done

          if [ "${failures}" -gt 0 ]; then
            echo "Warning: ${failures} jsDelivr purge requests failed."
          fi
